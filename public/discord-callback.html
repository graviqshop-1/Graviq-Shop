<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Discord Login Callback...</title>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #334155;
      border-top-color: #5865F2;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status {
      font-size: 14px;
      font-weight: 600;
      color: #94a3b8;
    }
    .error {
      color: #f87171;
    }
  </style>
</head>
<body>
  <div class="spinner" id="spinner"></div>
  <div class="status" id="status">Verifiziere Discord-Konto...</div>

  <script>
    (async function handleDiscordCallback() {
      const statusEl = document.getElementById('status');
      const spinnerEl = document.getElementById('spinner');

      try {
        // Parse Hash parameters (#access_token=...&token_type=Bearer)
        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        const searchParams = new URLSearchParams(window.location.search);
        
        const accessToken = hashParams.get('access_token');
        const error = hashParams.get('error') || searchParams.get('error');

        if (error) {
          throw new Error('Discord Anmeldung abgebrochen oder fehlgeschlagen: ' + error);
        }

        if (!accessToken) {
          throw new Error('Kein Access Token von Discord erhalten.');
        }

        // Fetch User profile from Discord API
        const response = await fetch('https://discord.com/api/v10/users/@me', {
          headers: {
            Authorization: `Bearer ${accessToken}`
          }
        });

        if (!response.ok) {
          throw new Error('Fehler beim Abrufen des Discord Profils.');
        }

        const discordUser = await response.json();
        
        const avatarUrl = discordUser.avatar
          ? `https://cdn.discordapp.com/avatars/${discordUser.id}/${discordUser.avatar}.png`
          : 'https://cdn.discordapp.com/embed/avatars/0.png';

        const payload = {
          id: discordUser.id,
          username: discordUser.global_name || discordUser.username,
          discordTag: discordUser.discriminator && discordUser.discriminator !== '0' 
            ? `${discordUser.username}#${discordUser.discriminator}` 
            : discordUser.username,
          email: discordUser.email || `${discordUser.username}@discord.id`,
          avatarUrl: avatarUrl
        };

        if (window.opener) {
          window.opener.postMessage({ type: 'DISCORD_OAUTH_SUCCESS', payload }, '*');
          statusEl.textContent = '✅ Erfolgreich angemeldet! Fenster schließt sich...';
          setTimeout(() => window.close(), 600);
        } else {
          statusEl.textContent = 'Erfolgreich eingeloggt! Du kannst dieses Fenster schließen.';
        }
      } catch (err) {
        console.error('Discord Auth Callback Error:', err);
        if (spinnerEl) spinnerEl.style.display = 'none';
        if (statusEl) {
          statusEl.className = 'status error';
          statusEl.textContent = '❌ ' + (err.message || 'Authentifizierungsfehler');
        }
        if (window.opener) {
          window.opener.postMessage({ type: 'DISCORD_OAUTH_ERROR', error: err.message }, '*');
          setTimeout(() => window.close(), 3000);
        }
      }
    })();
  </script>
</body>
</html>
